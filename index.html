<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zone A — VR Exhibition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame pinned to a specific version (not "latest") so the scene
         doesn't silently change when A-Frame ships an update. -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Shared captions loader + custom components, in <head> AFTER A-Frame
         so the components are registered before <a-scene> parses them. -->
    <script src="js/captions.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/components.js"></script>
    <!-- Zone B (10×10 image wall). AFTER components.js: it reuses that file's
         hover/focus components (its wall width is pinned in the tag below —
         the old auto-size-from-Zone-A's-ring path died with the ring). -->
    <script src="js/zone-b.js"></script>
    <!-- Zone B floor map (100 locations behind the wall). AFTER zone-b.js so
         it can read the wall's placement + width as its own defaults. -->
    <script src="js/zone-b-map.js"></script>
    <!-- Shared transition + teleport machinery (transition-glitch component,
         TeleportRig helper) — zone-agnostic, reused by the zone teleports. -->
    <script src="js/transition.js"></script>
    <!-- Shared terminal furniture (pedestal + screen + hover + hit box),
         used by the teleport terminals and the per-zone info terminals. -->
    <script src="js/terminal-kit.js"></script>
    <!-- Zone B teleport terminals (wall <-> floor map). AFTER zone-b-map.js
         and transition.js: it reads their live config and triggers the
         camera's glitch. -->
    <script src="js/zone-b-teleport.js"></script>
    <!-- Zone B triptych sub-zone (three stacked Ticket 485496 images).
         AFTER zone-b.js: it sizes its images from the wall's live tile
         metrics and reuses its hover/focus components. -->
    <script src="js/zone-b-triptych.js"></script>
    <!-- Zone C (outdoor cinema screen). -->
    <script src="js/zone-c.js"></script>
    <!-- In-scene exhibition title (floats in front of spawn, dissolves on
         first exploration input or after a hold time). -->
    <script src="js/title.js"></script>
    <!-- Reusable đá mài terrazzo park bench (primitives + runtime canvas
         texture, zone-agnostic — instances are placed per zone). -->
    <script src="js/bench.js"></script>
    <!-- Local tinted-terrazzo floor patches (per-room/-hallway colourways over
         the shared global floor). AFTER bench.js: reuses makeTerrazzoTexture.
         Used by Zone C (dark) and Zone B (soft coral). See js/tinted-floor.js. -->
    <script src="js/tinted-floor.js"></script>
    <!-- Zone titles + wall texts (single source, UTF-8) and the info
         terminals that display them. AFTER terminal-kit.js (shared
         furniture). -->
    <script src="js/zone-texts.js"></script>
    <script src="js/info-terminal.js"></script>
    <!-- Swappable environment layer: presets + environment-manager. Loaded
         before <a-scene> parses so the component is registered in time. -->
    <script src="js/environment.js"></script>
    <!-- Floorplan: the white-walled rooms + open hallways the zones sit in.
         Independent of the environment layer (it is architecture, not
         atmosphere) and of the zones — it reads nothing from either. -->
    <script src="js/floorplan.js"></script>
    <!-- Rig collision: constrains smooth locomotion to the walkable floor
         (rooms + corridors), reading the floorplan's OWN config as the single
         source of truth. AFTER floorplan.js so the config is defined; it also
         re-reads on the floorplan's `floorplanbuilt` event. See
         js/rig-collision.js. -->
    <script src="js/rig-collision.js"></script>
    <!-- Zone A V2: the chung cư corridor sub-space (the nine images' new home,
         parked 400 m out) and the booth pair that teleports you in and out.
         LAST of the scene scripts, because it needs all of these registered
         first: teleport-terminal + TerminalKit (booth furniture), TeleportRig +
         transition-glitch (the masked jump), floorplan (the Zone A room centre)
         and rig-collision (the walkable-region registry it adds itself to). -->
    <script src="js/zone-a-corridor.js"></script>

    <!-- Desktop focus-overlay styles. -->
    <link rel="stylesheet" href="css/focus.css" />
    <!-- Zone B web focus overlay styles (blurred overlay, Helvetica). -->
    <link rel="stylesheet" href="css/zone-b-focus.css" />
    <!-- Info-terminal web focus overlay styles (same blurred grammar). -->
    <link rel="stylesheet" href="css/info-focus.css" />

    <!-- Loading splash: full-viewport exhibition title card, visible from the
         very first paint (plain HTML/CSS — no framework, no webfont: system
         Roboto/Helvetica stack only). Dismissed by the small script at the end
         of <body> when the A-Frame scene fires `loaded`: a 1 s opacity fade
         (this transition), then display:none. pointer-events dies with the
         fade's start so the Enter VR button is clickable immediately. -->
    <style>
      #title-splash {
        position: fixed;
        inset: 0;
        z-index: 10000; /* above canvas AND the dev HUD */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #f4f4f4;
        font-family: Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 0 1.5rem;
        opacity: 1;
        transition: opacity 1s ease;
      }
      #title-splash.dismissed {
        opacity: 0;
        pointer-events: none; /* Enter VR reachable as soon as the fade starts */
      }
      #title-splash h1 {
        margin: 0;
        font-size: clamp(1.7rem, 5.5vw, 3.1rem);
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: 0.01em;
        max-width: 18em;
      }
      #title-splash .subtitle {
        margin: 1.4em 0 0;
        font-size: clamp(0.95rem, 2.8vw, 1.35rem);
        font-weight: 400;
        line-height: 1.55;
        color: #c9c9c9;
        max-width: 32em;
      }
      #title-splash .byline {
        margin: 2.2em 0 0;
        font-size: clamp(0.8rem, 2.2vw, 1rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        color: #969696;
      }
      /* Minimal loading indicator: one small pulsing dot (no spinner). */
      #title-splash .loading-dot {
        margin-top: 3rem;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e8e8e8;
        animation: title-splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes title-splash-pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
    </style>

    <!-- Dev-only environment HUD. Plain 2D overlay, hidden by default; the
         environment-manager shows it only when ?debug is in the URL (or you
         press `h`). Never part of the normal experience, never in VR. -->
    <style>
      #env-hud {
        position: fixed;
        left: 10px;
        bottom: 10px;
        z-index: 9999;
        font: 12px/1.4 monospace;
        color: #4caf50;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none; /* never steals clicks from the scene */
        user-select: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading splash (styles in <head>): the exhibition title card shown
         while A-Frame boots. First in <body> so it paints before the canvas. -->
    <div id="title-splash">
      <h1>New Topographies of Memory and&nbsp;Chance</h1>
      <p class="subtitle">
        Expanded Photography, Algorithms, and Transnational Belonging
        in Ho Chi Minh City
      </p>
      <p class="byline">a virtual exhibition by Christian Berg</p>
      <div class="loading-dot" aria-hidden="true"></div>
    </div>

    <!-- <a-scene> is a NEUTRAL host: it sets no background, fog, or lighting
         itself. defaultLightsEnabled:false stops A-Frame injecting its default
         light rig, so the environment presets fully own lighting. -->
    <a-scene light="defaultLightsEnabled: false" webxr="optionalFeatures: layers">
      <!-- Preload the nine images; entities reference them by id (#atpihl-N)
           so each file is fetched and decoded once, then shared. -->
      <a-assets>
        <img id="atpihl-1" src="ATPIHL/ATPIHL1.jpg" />
        <img id="atpihl-2" src="ATPIHL/ATPIHL2.jpg" />
        <img id="atpihl-3" src="ATPIHL/ATPIHL3.jpg" />
        <img id="atpihl-4" src="ATPIHL/ATPIHL4.jpg" />
        <img id="atpihl-5" src="ATPIHL/ATPIHL5.jpg" />
        <img id="atpihl-6" src="ATPIHL/ATPIHL6.jpg" />
        <img id="atpihl-7" src="ATPIHL/ATPIHL7.jpg" />
        <img id="atpihl-8" src="ATPIHL/ATPIHL8.jpg" />
        <img id="atpihl-9" src="ATPIHL/ATPIHL9.jpg" />
      </a-assets>

      <!-- ============================================================
           ENVIRONMENT LAYER — everything atmospheric (background/sky,
           fog, lights, ground, grid, particles), swappable as one unit.
           The zones NEVER set any of these. environment-manager builds the
           active preset's children in here and tears them down on switch.
           FIXED on "void" (the migrated white look): runtime preset switching
           via the `e` key / right-hand `B` button is DISABLED
           (ENV_CYCLE_ENABLED in js/environment.js). ?env=<preset> still
           overrides on load for dev/debug. See js/environment.js.
           ============================================================ -->
      <a-entity id="environment" environment-manager="preset: void"></a-entity>

      <!-- ============================================================
           FLOORPLAN — the architecture: four white-walled rooms (foyer/central
           + one per zone) joined by low hallways. Every wall is generated at
           runtime from the component's room/hallway config — primitives only,
           no asset files (same no-asset approach as the contact cues). It
           builds NO floor: the environment preset's ground plane is the floor,
           so the rooms sit on whatever preset is active.

           Heights are per-room, and the hallways are deliberately LOWER than
           the rooms, so you duck through a passage and the space opens up:
           foyer 5 m and Zone A 5 m; Zones B & C 10 m (their screen / image wall
           top out at ~7.1 m / ~4.9 m); hallways 3 m, with a lintel of wall
           carried over each doorway. Every room is ceilinged and every hallway
           roofed, so the exhibition is a closed white interior throughout — the
           environment preset's sky is never seen from inside.

           A SIBLING of #environment, not a child: the walls are architecture,
           so they must PERSIST across environment switches (env teardown only
           touches #environment) — same reasoning as the zones' contact cues.

           Visual only here — this entity builds no collision. Walkability is
           enforced by #rig's rig-collision component, which reads THIS
           floorplan's own room/hallway config (js/rig-collision.js).

           Tunables (no code edits — setAttribute on #floorplan): height /
           thickness / color / shader, plus the full `rooms` and `hallways`
           config. See js/floorplan.js.
           ============================================================ -->
      <a-entity id="floorplan" floorplan></a-entity>

      <!-- ============================================================
           ZONE C DARK FLOOR — a LOCAL dark inverted-terrazzo plane over just
           the Zone C footprint. The exhibition floor is ONE global 64 m ground
           plane shared by every room (js/environment.js), so it cannot be
           darkened without darkening Zones A/B too; this lays a second, small
           near-black terrazzo plane covering only Zone C, sized LIVE from the
           floorplan's zoneC room config and re-derived on `floorplanbuilt`.

           A SIBLING of #floorplan, not a child of #environment: like the walls
           and the contact cues it must PERSIST across environment switches. It
           sits a hair above the global floor and below the contact cues, so the
           cue glow pools render on top of it. Tunables (setAttribute on this
           entity): base / fleck1 / fleck2 / density / seed / tile / ylift.
           See js/tinted-floor.js.
           ============================================================ -->
      <a-entity id="zone-c-floor" tinted-floor></a-entity>
      <!-- ...and a matching dark strip over the central-zoneC hallway floor, so
           the dark approach into the cinema is dark underfoot too. Same
           component, driven from the hallway's corridor config; the strip spans
           inner-face to inner-face, abutting the Zone C room floor at one end and
           stopping at the foyer doorway threshold at the other. -->
      <a-entity id="zone-c-hall-floor" tinted-floor="hallway: central-zoneC"></a-entity>
      <!-- Zone B (the lottery): soft-coral terrazzo over the room footprint AND
           its approach hallway, matching the coral walls/ceiling. Same
           tinted-floor component with a coral palette (body a touch deeper than
           the walls, lighter + darker flecks for speckle). Lighting is unchanged
           in Zone B, so the floor reads as soft coral. The hall strip abuts the
           Zone B room floor at one end and stops at the foyer threshold at the
           other. -->
      <a-entity
        id="zone-b-floor"
        tinted-floor="room: zoneB; base: #eeaaa6; fleck1: #ffd0cc; fleck2: #db938e"
      ></a-entity>
      <a-entity
        id="zone-b-hall-floor"
        tinted-floor="hallway: central-zoneB; base: #eeaaa6; fleck1: #ffd0cc; fleck2: #db938e"
      ></a-entity>

      <!-- ============================================================
           EXHIBITION TITLE — the in-scene counterpart of the loading splash:
           the same three lines floating ~3.5 m in front of spawn at eye
           height, facing spawn, WORLD-FIXED, standing clear in the foyer
           (nothing else is within ~5 m of it). Activates when the scene loads
           (in sync with the splash fade) and dissolves on the first
           exploration input — or after holdDuration on its own. One-shot;
           zero per-frame cost once gone. Tunables: holdDuration /
           fadeDuration / gracePeriod / moveThreshold / offset / textScale
           (see js/title.js).
           ============================================================ -->
      <a-entity id="exhibition-title" exhibition-title></a-entity>

      <!-- ============================================================
           ZONE A — "All the Places I Have Lived". The room is now EMPTY.

           V1 stood the nine images in here, in a half-circle ring around the
           middle of the room. V2 takes them out of the gallery entirely: the
           work is about nine Saigon neighbourhoods lived in, so the images now
           hang in a place rather than in a white room — three one-room
           apartments off the corridor of an old chung cư (see
           #zone-a-corridor below). The ring, its layout component and its
           floor cues are gone from the codebase; only the shared image config
           (COUNT / IMG_SIZE / IMG_Y / ASSET_PREFIX in js/components.js)
           survives, and the corridor's apartment walls read it.

           So this room holds exactly two things: the info terminal (the work's
           statement) and — as a SIBLING entity, because it stands in world
           coordinates derived from the floorplan rather than from this root —
           the teleport booth that takes you to the corridor.

           zone-a-root still offsets everything parented HERE as one unit;
           default 12.5 m back (-z), which is where the room is. Sets no
           background / fog / lights / ground, like every zone root.
           ============================================================ -->
      <a-entity id="zone-a" zone-a-root="offset: 0 0 -12.5">
        <!-- Zone A info terminal: screen facing spawn (+z), off to the +x side
             of the now-empty room and forward toward the doorway, so you pass
             it on the way in and it never crowds the booth in the middle
             (~2.5 m of clear floor between the two hit boxes). NUDGE BY EYE via
             position/rotation (local; the zone-a-root offset carries it).
             Cue = shared spot-contact-cue. -->
        <a-entity
          id="info-terminal-a"
          info-terminal="key: a"
          position="3.4 0 1.9"
          rotation="0 0 0"
          spot-contact-cue
        ></a-entity>
      </a-entity>

      <!-- ============================================================
           ZONE A TELEPORT — the booth pair linking the (empty) Zone A room to
           the chung cư corridor parked 400 m out, each jump masked by the
           camera's transition-glitch exactly like the Zone B map jump.
           A SIBLING of #zone-a, not a child, for the same reason
           #zone-b-teleport is a sibling of #zone-b: the manager places its
           terminals in WORLD coordinates it derives itself.

           The OUTBOUND booth (#terminal-a2) stands in the MIDDLE of the Zone A
           room — its centre read live from the floorplan's rooms.zoneA, so no
           coordinate is copied here — screen facing +z, back toward the
           doorway from the foyer, so it is the first thing you read walking in.
           Its screen carries the work's TITLE, which the manager reads from
           js/zone-texts.js (the same single source the info terminal uses); the
           label is deliberately NOT written here, so the string exists once.

           The RETURN booth lives inside #zone-a-corridor (it must hide and
           relocate with it) — see that block below.

           Tunables on zone-a-teleport: boothOffset (from the room centre).
           Terminal geometry + hit sizes on the teleport-terminal itself;
           glitch dur / intensity / color / style / sound on the camera's
           transition-glitch.
           ============================================================ -->
      <a-entity id="zone-a-teleport" zone-a-teleport>
        <a-entity id="terminal-a2" teleport-terminal spot-contact-cue></a-entity>
      </a-entity>

      <!-- ============================================================
           ZONE A CORRIDOR — the nine images’ actual home: the long corridor
           of an old Saigon chung cư (apartment block), with three one-room
           apartments off its far end holding three images each.

           A TELEPORT SUB-SPACE, built on exactly the pattern the Zone B floor
           map established: the root offset parks the whole thing 400 m out on
           +z — the floor map is 400 m out on −z, so the two sub-spaces can
           never meet, and neither is reachable on foot from the gallery — and
           `shown: false` hides it. That hiding is a PURE visibility flip: every
           procedural canvas texture stays resident on the GPU, so the first
           teleport in has no hitch. (It also strips the pictures’ clickable
           class while hidden, so no stray desktop ray can reach a picture
           parked behind the gallery.)

           Root-local frame: the landing is z 0..landingDepth, closed behind
           you; the corridor runs from z 0 out to z −length; x 0 is the
           centreline; the floor is y 0 and the ceiling y height.

           EVERYTHING here is generated at runtime from the schema — geometry
           from primitives, and every surface from a seeded canvas texture (no
           image assets, the same approach as the contact cues and the terrazzo
           bench). All of it is UNLIT (`shader: flat`): the gallery’s lights
           only exist over the floorplan’s rooms, so 400 m out the corridor
           bakes its own light into the textures instead — darker toward the
           ceiling, a pool under every tube, dark margins along the floor edges.
           That makes it independent of the active environment preset and free
           per frame.

           ?zonea=debug on the URL shows the corridor on load and drops you on
           the landing facing down it — the iteration path, same convention as
           environment.js’s ?env= / ?debug.

           Tunables (all on corridor-root, all with defaults — see the full
           annotated list in js/zone-a-corridor.js): offset / shown; length /
           width / height / landingDepth; doorPitch / doorWidth / doorHeight /
           transomHeight; roomWidth / roomDepth / roomSpacing; wallThickness;
           textureSize / seed; tubeSpacing / tubeColor; and the joinery
           (frameWidth / frameDepth / frameColor / leafThickness /
           doorOpenAngle / floorTile / roomTile / tubeWidth / tubeLength /
           tubeDrop / imageProud / focusDistance / focusDimRadius).
           ============================================================ -->
      <a-entity id="zone-a-corridor" corridor-root="offset: 0 0 400; shown: false">
        <!-- RETURN BOOTH — the way home, standing on the landing against its
             back wall with its screen facing back down the corridor, so you
             read it the moment you turn around on arrival and again as you
             walk back up the run. A CHILD of the corridor root, so it hides
             and relocates with it (exactly like the floor map's return
             terminals under #zone-b-map); the manager derives its spot from
             the corridor's own landingDepth.

             It borrows the map terminals’ amber accent and their EXIT
             grammar deliberately: one “way home” language across the whole
             exhibition. No beacon — that exists to be findable across a 25 m
             floor map, and this is a 2.2 m-wide corridor. Its cue is forced to
             glow, like Zone C’s, because the corridor floor is dark cement and
             the void preset’s shadow pool would be invisible on it. -->
        <a-entity
          id="terminal-a2-return"
          teleport-terminal="label: EXHIBITION; accent: #ffc400"
          spot-contact-cue="forceGlow: true"
        ></a-entity>
      </a-entity>

      <!-- ============================================================
           ZONE B — a 10×10 wall of 100 images, to the RIGHT of spawn.
           zone-b-root offsets the WHOLE wall as a unit (same pattern/intent as
           zone-a-root); default ~6 3 0 places it to the right (+x) and raised.
           Tune via the zone-b-root `offset` property — not the grid math.

           The inner container's `0 -90 0` rotation turns the wall (built FLAT
           by image-wall, facing +z) to face -x, back toward spawn. So facing
           -z you see Zone A; turn right 90° (face +x) and the wall is dead
           ahead, its width spanning the view. All wall tunables (width / gap /
           rows / cols / aspect) live on the image-wall component.
           ============================================================ -->
      <a-entity id="zone-b" zone-b-root="offset: 25 3 -1.2">
        <!-- `shuffle: true` randomizes the wall's image order per load (seed the
             optional shuffleSeed>0 for a reproducible order). Off by default =
             today's manifest order; the floor map is unaffected (it picks by
             file ID, not wall index). -->
        <a-entity
          id="zone-b-wall"
          rotation="0 -90 0"
          image-wall="rows: 5; cols: 20; width: 22.46; aspect: 1.5; shuffle: true"
          wall-focus
        ></a-entity>

        <!-- Per-tile floor contact cue under the wall's BOTTOM ROW. Lives under
             #zone-b so it PERSISTS across environment switches (env teardown
             only touches #environment); it reuses Zone A's cue machinery via the
             shared ContactCue kit and retunes to each preset's ground profile.
             Count + positions derive from the wall's live grid (#zone-b-wall).
             Tunables: radius / opacity / softness / yoffset. -->
        <a-entity wall-contact-cue="wall: #zone-b-wall"></a-entity>

        <!-- Zone B info terminal: at the wall's LEFT edge (the teleport
             terminal holds the right edge), angled 45° from the wall's -x
             facing toward the spawn point (which sits almost exactly on
             that diagonal from this corner). Local to #zone-b: y -3
             counteracts the root's raised y (floor). NUDGE BY EYE via
             position/rotation. -->
        <a-entity
          id="info-terminal-b"
          info-terminal="key: b"
          position="-1.2 -3 -12.23"
          rotation="0 -45 0"
          spot-contact-cue
        ></a-entity>

        <!-- TRIPTYCH SUB-ZONE — three stacked Ticket 485496 images just past
             the wall's LEFT end (opposite Terminal A's side, beyond
             info-terminal-b), turned 90° to the wall: at yaw 0 the stack
             faces +z, back along the wall's axis, so it reads face-on as
             you walk the wall toward its left end (it is edge-on from
             spawn — by design). Local to #zone-b: y -3 counteracts the
             root's raised y (floor); x -1.2 lines up with the terminals'
             wall clearance; z -13.9 clears info-terminal-b's hit box by
             ~1 m. PLACEHOLDER — NUDGE BY EYE via this position/rotation
             (the whole sub-zone moves as a unit). Stack tunables
             (imageScale / bottomHeight / stackGap) live on zone-b-triptych. -->
        <a-entity id="zone-b-triptych" position="-1.2 -3 -13.9" rotation="0 0 0">
          <!-- wall-focus is the wall's own capture-and-restore lightbox,
               reused UNFORKED: it delegates clicks from its child tiles, so
               a second instance on the stack gives the triptych the exact
               same focus grammar (VR fly-out + web blurred overlay, one at
               a time — each instance's `focused` guard keeps them apart). -->
          <!-- One elliptical floor cue under the stack footprint: the shared
               spot-contact-cue (same kit + env-switch retune as every other
               cue; it persists across environment switches because it lives
               under #zone-b, not #environment). Width spans the stack's
               ~1.62 m of images with margin; size/opacity BY EYE.
               The stack sits LEFT of the info terminal as a visitor faces
               the sub-zone (group-local -x): x -3.0 keeps ~0.2 m between
               the images' edge and the terminal's hit box. -->
          <a-entity
            id="zone-b-triptych-stack"
            position="-3.0 0 0"
            zone-b-triptych="wall: #zone-b-wall; imageScale: 1.5"
            wall-focus
            spot-contact-cue="width: 2.1; depth: 0.9; opacity: 0.3"
          ></a-entity>

          <!-- Triptych info terminal: to the stack's RIGHT as a visitor
               faces the sub-zone (the stack sits at group-local x -3.0,
               this terminal at -1.4), screen facing the same way as the
               images. Its hit box (~0.57 m half-width) clears the stack's
               images by ~0.2 m and stays ~1 m from info-terminal-b's.
               NUDGE BY EYE via position/rotation (the placement-offset
               tunable for this terminal). -->
          <a-entity
            id="info-terminal-d"
            info-terminal="key: d"
            position="-1.4 0 0"
            rotation="0 0 0"
            spot-contact-cue
          ></a-entity>
        </a-entity>
      </a-entity>

      <!-- ============================================================
           ZONE B FLOOR MAP — the "100 locations" dataset as a walkable street
           map: a pale Saigon street map (baked offline by
           tools/bake-map-texture.js — no runtime tile fetching) flat on the
           floor, 100 colored spheres above their real coordinates, grounded
           by small contact cues; clicking a sphere reveals its artwork (the
           wall's focus grammar, by-ID image mapping).

           NOW A TELEPORT DESTINATION: the root offset parks the whole
           assembly 400 m out on -z — far past every environment's geometry
           (skyline ring 18 m, cityroom 32 m), unreachable and invisible by
           walking — and `shown: false` hides it (a pure visibility flip; the
           texture still loads and is GPU-preloaded, so the first jump has no
           hitch). The terminal beside the image wall teleports you there
           (see zone-b-teleport below); Terminal B inside this assembly
           brings you back, and moves/hides with the map automatically.

           zone-b-map-root offsets the WHOLE assembly as a unit (same pattern
           as the other zone roots); its base spot is DERIVED live from
           #zone-b's offset, so `offset` here is a delta from "on the wall
           line, at floor level" — the board extends along +x from there. The
           inner container carries the wall's same `0 -90 0` yaw so the map
           width matches the wall's width.

           Tunables: root offset + shown (here); mapWidth (0 = wall width) /
           basePlaneOpacity / sphereRadius / hoverHeight / gapBehindWall on
           map-board; radius / opacity / softness / yoffset on map-contact-cue;
           distance / height / dimRadius / dimOpacity / dur / aspect on
           map-focus.
           ============================================================ -->
      <a-entity id="zone-b-map" zone-b-map-root="offset: 0 0 -400; shown: false">
        <a-entity
          id="zone-b-map-board"
          rotation="0 -90 0"
          map-board
          map-focus
        ></a-entity>

        <!-- Per-sphere contact cue ON the map plane. Lives under #zone-b-map
             so it PERSISTS across environment switches (env teardown only
             touches #environment); reuses the shared ContactCue kit and
             retunes to each preset's ground profile like every other zone. -->
        <a-entity map-contact-cue="board: #zone-b-map-board"></a-entity>

        <!-- Return terminals — ONE per map edge (near/far/left/right), so the
             way home is in view from anywhere on the map. All children of the
             map root (relocate + hide/show with the map); the manager derives
             each one's edge position + inward facing live from the board and
             wires every one to the SAME return jump. Bright amber accent screen
             + a tall EXIT beacon above the sphere field make them unmistakable
             against the dark surround. `data-edge` tells the manager which edge.
             Cue yoffset clears the map plane's own +0.02 lift. -->
        <a-entity
          id="terminal-b"
          data-edge="near"
          teleport-terminal="label: EXIT; accent: #ffc400; beacon: true; beaconLabel: EXIT"
          spot-contact-cue="yoffset: 0.04"
        ></a-entity>
        <a-entity
          id="terminal-b-far"
          data-edge="far"
          teleport-terminal="label: EXIT; accent: #ffc400; beacon: true; beaconLabel: EXIT"
          spot-contact-cue="yoffset: 0.04"
        ></a-entity>
        <a-entity
          id="terminal-b-left"
          data-edge="left"
          teleport-terminal="label: EXIT; accent: #ffc400; beacon: true; beaconLabel: EXIT"
          spot-contact-cue="yoffset: 0.04"
        ></a-entity>
        <a-entity
          id="terminal-b-right"
          data-edge="right"
          teleport-terminal="label: EXIT; accent: #ffc400; beacon: true; beaconLabel: EXIT"
          spot-contact-cue="yoffset: 0.04"
        ></a-entity>
      </a-entity>

      <!-- ============================================================
           ZONE B TELEPORT — the terminal pair linking the image wall to the
           relocated floor map, each jump masked by the camera's
           transition-glitch (rig moves at peak obscuration; see
           js/zone-b-teleport.js and js/transition.js).

           Terminal A is a freestanding sign in the MIDDLE of the Zone B room
           (its centre read live from the floorplan — no copied numbers); its
           screen shows a central-Saigon detail cropped from the baked map JPEG
           (reusing the existing asset) as a preview of the destination.
           Teleporting back lands you at this same spot.

           Tunables on zone-b-teleport: terminalAOffset (from the room centre) /
           mapSpawnOffset / returnSpawnOffset / returnInset (each return terminal's
           inset inside its map edge) / returnY. Terminal geometry + hit sizes,
           and the return terminals' accent / beacon / beaconHeight / beaconWidth /
           beaconLabel, on each teleport-terminal; glitch dur / intensity / color /
           style / sound on the camera's transition-glitch.
           ============================================================ -->
      <a-entity id="zone-b-teleport" zone-b-teleport>
        <a-entity
          id="terminal-a"
          teleport-terminal="screenSrc: assets/zone-b-map-saigon.jpg;
                             cropMin: 0.28 0.18; cropMax: 0.62 0.42"
          spot-contact-cue
        ></a-entity>
      </a-entity>

      <!-- ============================================================
           ZONE C — the cinema: one 16:9 video screen, OPPOSITE Zone B, in a
           dark screening room (charcoal walls/ceiling + dark terrazzo floor).
           zone-c-root offsets the WHOLE assembly (screen + controls + audio +
           bench + terminal + cues) as a unit (same pattern as zone-a-root /
           zone-b-root). The offset x seats the screen 0.30 m off the Zone C
           back-wall inner face: that inner face is cx - w/2 + thickness/2 =
           -14.7 - 7.6 + 0.075 = -22.225, so +0.30 lands the screen (whose world
           x equals this offset x) at ~-21.9. Facing +x you see the wall; facing
           -x you see the cinema. The screen is rotated inside the component to
           face back toward spawn.

           screenHeight 8.8 nearly fills the 10 m wall (width derives 16:9 →
           ~15.6 m, within the room's z extent), bottom edge 0.8 m off the floor
           — low enough that the control strip just below it almost touches the
           floor. The strip sits under the screen's bottom edge (over the dark
           wall, not over the bright video: floating it in front flickered on the
           Quest). controlsScale 0.7 shrinks that strip. All other tunables
           (screenWidth / screenHeight / screenHeightAboveFloor / controlsScale /
           controlsFadeDelay / audioRefDistance / audioRolloff) live on the
           zone-c-root schema — see js/zone-c.js.
           ============================================================ -->
      <a-entity
        id="zone-c"
        zone-c-root="offset: -21.9 3 -0.5; screenHeight: 8.8; screenHeightAboveFloor: 0.8; controlsScale: 0.7"
      >
        <!-- Floor contact cue under the screen: one wide elliptical pool
             (cueWidth AUTO-tracks 1.2 × screenWidth; the control strip gets
             none). Lives under #zone-c so it PERSISTS across environment
             switches (env teardown only touches #environment); it reuses the
             shared ContactCue kit and retunes its material to each preset's
             ground profile, exactly like Zone B's wall cues and every spot
             cue — with an `intensity` boost on the profile opacity so
             this one big pool doesn't read faint. Tunables: cueWidth /
             cueDepth / intensity / opacity / softness / yoffset.
             forceGlow: the Zone C floor is dark, so the void preset's shadow
             pool would be invisible on it — force this cue to an additive light
             glow instead (survives environment switches).
             TEMP TEST (Quest video flicker): visible=false hides this big
             additive glow quad to test whether it — not the video — is the
             source of the white flashes / edge flicker during playback. Remove
             visible="false" to restore the grounding pool. -->
        <a-entity screen-contact-cue="forceGlow: true" visible="false"></a-entity>

        <!-- TWO đá mài terrazzo benches, a symmetric seated viewing row pulled
             well back from the (now wall-filling) screen for a comfortable
             viewing distance. They FLANK the screen's centreline (local z 0 =
             the screen's centre) at local z ±7.4, so they read as mirror-
             symmetric about the screen; both sit at the same local x (distance
             from the screen) and same yaw. Both ride the zone-c-root offset; the
             local y -3 counteracts the root's raised y so they sit on the world
             floor. NUDGE BY EYE (keep x and |z| equal to stay symmetric):
               position — local; +x is toward spawn, y -3 = floor, ±z = the two
                          sides of the screen's centreline.
               rotation — yaw -90 turns the sitter to face the screen (-x).
             Mid-grey terrazzo (bodyColor) — was đá mài green. Each carries the
             shared spot-contact-cue (bench-sized elliptical footprint, forced to
             glow on the dark floor like every other Zone C cue). -->
        <a-entity
          id="zone-c-bench-left"
          terrazzo-bench="bodyColor: #84878b"
          position="10.5 -3 7.4"
          rotation="0 -90 0"
          spot-contact-cue="width: 2.0; depth: 1.0; yoffset: 0.02; forceGlow: true"
        ></a-entity>
        <a-entity
          id="zone-c-bench-right"
          terrazzo-bench="bodyColor: #84878b"
          position="10.5 -3 -7.4"
          rotation="0 -90 0"
          spot-contact-cue="width: 2.0; depth: 1.0; yoffset: 0.02; forceGlow: true"
        ></a-entity>

        <!-- Zone C info terminal: moved OFF the central viewing axis so it never
             covers the screen — to the +z side and forward toward the back wall,
             past the screen's z-edge (the screen spans z ≈ ±8 around its centre,
             so z 10.5 sits beside it, not in front of it). Screen faces the
             seating/approach (+x). Local to #zone-c: y -3 counteracts the root's
             raised y (floor). NUDGE BY EYE via position/rotation. -->
        <a-entity
          id="info-terminal-c"
          info-terminal="key: c"
          position="3 -3 10.5"
          rotation="0 90 0"
          spot-contact-cue="forceGlow: true"
        ></a-entity>
      </a-entity>

      <!-- Desktop mouse cursor + raycaster (rayOrigin: mouse). Limits hits to
           .clickable and emits mouseenter/mouseleave/click on the images. -->
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

      <!-- CAMERA RIG: empty parent at floor level holding the camera + both
           controllers. VR locomotion moves the RIG (view + hands together)
           while the headset head-tracks the camera within it. -->
      <a-entity id="rig" position="0 0 0" rig-collision>
        <!-- Camera at standing eye height; desktop controls unchanged.
             near:0.1 (up from the 0.005 default) tightens the depth range so
             far-off surfaces — the floor, skyline plane edges — stop shimmering
             at grazing angles. far left at default so distant a-sky preset
             skies still render. -->
        <!-- transition-glitch: the reusable full-view glitch that masks
             teleports (and later, zone entries). Idle it renders nothing and
             ticks nothing; triggered by zone-b-teleport. Tunables: dur /
             intensity / color / style / sound (file replaces the synth blip). -->
        <a-entity
          id="camera"
          camera="near: 0.1"
          look-controls
          wasd-controls
          position="0 1.6 0"
          transition-glitch
        ></a-entity>

        <!-- RIGHT controller: laser pointer + right-stick smooth movement.
             laser-controls fires the SAME mouseenter/mouseleave/click events
             as the desktop mouse, so image-hover and focus-on-click are
             reused as-is. raycaster objects:.clickable targets the images. -->
        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 100"
          smooth-locomotion
        ></a-entity>

        <!-- LEFT controller: laser pointer + left-stick 45° snap turn. -->
        <a-entity
          id="leftHand"
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 100"
          snap-turn
        ></a-entity>
      </a-entity>
      <!-- (Comfort vignette would go here later: darken the view edges while
           smooth-locomotion is actively moving. Not added yet.) -->
    </a-scene>

    <!-- Desktop focus overlay DOM. Lives OUTSIDE <a-scene>: plain HTML/CSS
         over the canvas, so it does NOT render in VR (the VR focus view is
         built from A-Frame entities in js/focus-vr.js instead). -->
    <div id="focus-overlay">
      <div id="focus-row">
        <div id="focus-main">
          <div id="focus-col">
            <img id="focus-image" src="" alt="" />
            <div id="focus-title"></div>
            <div id="focus-meta"></div>
            <!-- Replay / stop the spoken memory. Auto-plays on open. -->
            <button id="focus-audio" type="button">Stop audio</button>
          </div>
          <button id="focus-reveal" type="button">Reveal memory</button>
        </div>
        <div id="focus-memory">
          <div id="focus-memory-inner">
            <button id="focus-memory-close" type="button" aria-label="Close memory">×</button>
            <div id="focus-memory-text"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Zone B web focus overlay DOM. Outside <a-scene>: plain HTML/CSS over the
         canvas (does NOT render in VR — the VR wall focus is built in-world by
         wall-focus in js/zone-b.js). Hidden until a wall tile is selected; the
         picture flies in from the tile's on-screen position. -->
    <div id="zoneb-focus">
      <!-- Prev/next paging arrows (wall-focus FEATURE 2). Shown only when the
           overlay carries .nav-on (added by wall-focus, never by map-focus, so
           single-image map reveals stay clean). -->
      <button id="zoneb-focus-prev" type="button" aria-label="Previous image">&#8249;</button>
      <div id="zoneb-focus-col">
        <img id="zoneb-focus-img" src="" alt="" />
        <div id="zoneb-focus-title"></div>
        <div id="zoneb-focus-year"></div>
        <div id="zoneb-focus-count"></div>
      </div>
      <button id="zoneb-focus-next" type="button" aria-label="Next image">&#8250;</button>
    </div>

    <!-- Info-terminal web focus overlay DOM. Outside <a-scene>: plain
         HTML/CSS over the canvas (does NOT render in VR — the headset gets
         the in-scene scrolling panel instead; see js/info-terminal.js).
         Hidden until an info terminal is clicked on desktop/mobile. -->
    <div id="info-focus">
      <div id="info-focus-col">
        <div id="info-focus-title"></div>
        <div id="info-focus-text"></div>
      </div>
    </div>

    <!-- Dev-only HUD: shows the active environment preset (fixed on `void`;
         ?env= can override for dev). Starts hidden; environment-manager
         reveals it on ?debug or the `h` key. -->
    <div id="env-hud" hidden>env: <span id="env-hud-name">—</span></div>

    <!-- Focus-view controllers, at END of <body> so the DOM/scene exist.
         focus-click in components.js routes to whichever is appropriate. -->
    <script src="js/focus-desktop.js"></script>
    <script src="js/focus-vr.js"></script>

    <!-- Splash dismissal: fade the title card out (1 s CSS transition) when
         the scene finishes loading, then remove it from the layout entirely.
         Inline because it's three lines of glue owned by the splash markup. -->
    <script>
      (function () {
        var splash = document.getElementById("title-splash");
        var scene = document.querySelector("a-scene");
        if (!splash || !scene) return;
        function dismiss() {
          scene.removeEventListener("loaded", dismiss);
          splash.classList.add("dismissed"); // starts the fade; clicks pass through
          setTimeout(function () {
            splash.style.display = "none";
          }, 1100); // just past the 1 s transition
        }
        // `loaded` may already have fired (cached assets, fast device).
        if (scene.hasLoaded) dismiss();
        else scene.addEventListener("loaded", dismiss);
      })();
    </script>
  </body>
</html>
